name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

env:
  QT_VERSION: "6.7.3"
  QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"

jobs:
  # ── 1. Unit Tests (QTest, no binary needed) ────────────────────────────────
  unit-tests:
    name: Unit Tests (QTest)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Configure (BUILD_TESTS=ON)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build test target
        run: cmake --build build --target anoa-browser-test-config --parallel

      - name: Run unit tests (CTest)
        run: ctest --test-dir build -V --output-on-failure

  # ── 2. Integration Tests (Node.js + running binary) ───────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install integration test dependencies
        working-directory: tests/integration
        run: npm install

      - name: Start anoa-browser
        run: |
          ./build/anoa-browser --headless --port 9222 &
          echo "BROWSER_PID=$!" >> $GITHUB_ENV
          timeout 30 bash -c 'until nc -z 127.0.0.1 9222; do sleep 0.5; done'

      - name: Run integration tests (Vitest)
        working-directory: tests/integration
        run: npx vitest run

      - name: Stop anoa-browser
        if: always()
        run: kill ${{ env.BROWSER_PID }} || true

  # ── 3. Shell Integration Tests ─────────────────────────────────────────────
  shell-tests:
    name: Shell Integration Tests
    runs-on: ubuntu-22.04
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - name: Run port layout tests
        run: bash tests/integration/port_layout.test.sh
        env:
          ANOA_BINARY: ./build/anoa-browser

      - name: Run extension loading tests
        run: bash tests/integration/extensions.test.sh
        env:
          ANOA_BINARY: ./build/anoa-browser

  # ── 4. E2E Tests (Playwright + Puppeteer) ─────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright / Puppeteer)
    runs-on: ubuntu-22.04
    needs: integration-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm install

      - name: Install Playwright browser
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Start anoa-browser
        run: |
          ./build/anoa-browser --headless --port 9222 &
          echo "BROWSER_PID=$!" >> $GITHUB_ENV
          timeout 30 bash -c 'until nc -z 127.0.0.1 9222; do sleep 0.5; done'

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Run Puppeteer tests
        working-directory: tests/e2e
        run: node --test puppeteer.test.js

      - name: Stop anoa-browser
        if: always()
        run: kill ${{ env.BROWSER_PID }} || true

  # ── 5. Regression Smoke Tests ─────────────────────────────────────────────
  smoke-tests:
    name: Regression Smoke Tests
    runs-on: ubuntu-22.04
    needs: e2e-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ws globally
        run: npm install -g ws

      - name: Run smoke tests
        run: bash tests/regression/smoke.sh
        env:
          ANOA_BINARY: ./build/anoa-browser