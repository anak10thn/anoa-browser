name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

env:
  QT_VERSION: "6.7.3"
  QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"

jobs:
  # ── 1. Unit Tests (QTest, no binary needed) ────────────────────────────────
  # Runs on both Linux and macOS: the QTest suite carries the check that QImage
  # decodes PNG under a plain QCoreApplication (no GUI application object),
  # which terminal mode depends on and which is platform-specific.
  unit-tests:
    name: Unit Tests (QTest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: macos-14
            qt_host: mac
            qt_arch: clang_64

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-${{ matrix.os }}

      # Only Linux needs this; the top-level find_package pulls in WebEngine,
      # which wants CUPS headers there.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libcups2-dev

      - name: Configure (BUILD_TESTS=ON)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build test target
        run: cmake --build build --target anoa-browser-test-config --parallel

      - name: Run unit tests (CTest)
        run: ctest --test-dir build -V --output-on-failure

  # ── 2. Integration Tests (Node.js + running binary) ───────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install integration test dependencies
        working-directory: tests/integration
        run: npm install

      # Do NOT start a shared anoa-browser here: every integration test file
      # spawns (and stops) its own instance on the same port triplet. A shared
      # instance on 9222 makes those spawns fail to bind, so auth suites end up
      # talking to the shared no-auth browser and fail with 200-instead-of-401.
      - name: Run integration tests (Vitest)
        working-directory: tests/integration
        run: npx vitest run

  # ── 3. Shell Integration Tests ─────────────────────────────────────────────
  shell-tests:
    name: Shell Integration Tests
    runs-on: ubuntu-22.04
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - name: Run port layout tests
        run: bash tests/integration/port_layout.test.sh
        env:
          ANOA_BINARY: ./build/anoa-browser

      - name: Run extension loading tests
        run: bash tests/integration/extensions.test.sh
        env:
          ANOA_BINARY: ./build/anoa-browser

  # ── 4. E2E Tests (Playwright + Puppeteer) ─────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright / Puppeteer)
    runs-on: ubuntu-22.04
    needs: integration-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm install

      - name: Install Playwright browser
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Start anoa-browser
        run: |
          ./build/anoa-browser --headless --port 9222 &
          echo "BROWSER_PID=$!" >> $GITHUB_ENV
          timeout 30 bash -c 'until nc -z 127.0.0.1 9222; do sleep 0.5; done'

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Run Puppeteer tests
        working-directory: tests/e2e
        run: node --test puppeteer.test.js

      - name: Stop anoa-browser
        if: always()
        run: kill ${{ env.BROWSER_PID }} || true

  # ── 5. Regression Smoke Tests ─────────────────────────────────────────────
  smoke-tests:
    name: Regression Smoke Tests
    runs-on: ubuntu-22.04
    needs: e2e-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # smoke.sh runs its node snippets from these directories — a global
      # npm install is not on Node's ESM resolution path.
      - name: Install smoke test dependencies
        run: |
          (cd tests/integration && npm install)
          (cd tests/e2e && npm install)

      - name: Run smoke tests
        run: bash tests/regression/smoke.sh
        env:
          ANOA_BINARY: ./build/anoa-browser