name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  QT_VERSION: '6.7.3'

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIC_BUILD=ON \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Strip & package
        run: |
          strip build/anoa-browser
          tar czf anoa-browser-linux-x86_64.tar.gz -C build anoa-browser

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-linux-x86_64
          path: anoa-browser-linux-x86_64.tar.gz

  build-macos:
    name: macOS universal
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-macos-clang64

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt frameworks
        run: macdeployqt build/anoa-browser.app -verbose=2 -always-overwrite

      - name: Package
        run: |
          strip build/anoa-browser.app/Contents/MacOS/anoa-browser || true
          tar czf anoa-browser-macos-universal.tar.gz -C build anoa-browser.app

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-macos-universal
          path: anoa-browser-macos-universal.tar.gz

  build-windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-windows-msvc2019

      - name: Configure
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt DLLs
        run: windeployqt build\Release\anoa-browser.exe --release --no-translations --no-opengl-sw

      - name: Package
        run: 7z a anoa-browser-windows-x86_64.zip .\build\Release\*

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-windows-x86_64
          path: anoa-browser-windows-x86_64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true