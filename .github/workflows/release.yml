name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  QT_VERSION: '6.7.3'

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            qt_arch: linux_gcc_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            qt_arch: linux_gcc_arm64

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Strip & package
        run: |
          strip build/anoa-browser
          tar czf anoa-browser-linux-${{ matrix.arch }}.tar.gz -C build anoa-browser

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-linux-${{ matrix.arch }}
          path: anoa-browser-linux-${{ matrix.arch }}.tar.gz

  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
            qt_arch: clang_64
          - arch: arm64
            runner: macos-14
            qt_arch: macos

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-macos-${{ matrix.arch }}

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Strip & package
        run: |
          strip build/anoa-browser
          tar czf anoa-browser-macos-${{ matrix.arch }}.tar.gz -C build anoa-browser

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-macos-${{ matrix.arch }}
          path: anoa-browser-macos-${{ matrix.arch }}.tar.gz

  build-windows:
    name: Windows x86_64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-windows-msvc2022

      - name: Configure
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: 7z a anoa-browser-windows-x86_64.zip build\Release\anoa-browser.exe

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-windows-x86_64
          path: anoa-browser-windows-x86_64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
