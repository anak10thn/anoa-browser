name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  QT_VERSION: '6.7.3'

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev file

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Install to AppDir
        run: |
          DESTDIR=AppDir cmake --install build
          mkdir -p AppDir/usr/lib
          # Copy all Qt + system shared libs needed by the binary
          ldd AppDir/usr/bin/anoa-browser | grep "=> /" | awk '{print $3}' | grep -v libc.so | grep -v libm.so | grep -v libpthread.so | grep -v libdl.so | grep -v librt.so | sort -u | while read lib; do
            cp -v "$lib" AppDir/usr/lib/
          done
          # Copy Qt plugins
          mkdir -p AppDir/usr/plugins
          for dir in platforminputcontexts platforms platformthemes xcbglintegrations imageformats iconengues; do
            if [ -d "$QT_ROOT_DIR/plugins/$dir" ]; then
              cp -r "$QT_ROOT_DIR/plugins/$dir" AppDir/usr/plugins/
            fi
          done
          # Copy Qt WebEngine resources (v8 snapshots, locales, etc.)
          if [ -d "$QT_ROOT_DIR/resources" ]; then
            cp -r "$QT_ROOT_DIR/resources" AppDir/usr/resources
          fi
          # Copy Qt translations
          if [ -d "$QT_ROOT_DIR/translations" ]; then
            mkdir -p AppDir/usr/translations
            cp -r "$QT_ROOT_DIR/translations/qtwebengine_*.qm" AppDir/usr/translations/ 2>/dev/null || true
          fi

      - name: Download linuxdeployqt
        run: |
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O linuxdeployqt
          chmod +x linuxdeployqt

      - name: Build AppImage
        run: |
          unset QTDIR; unset QT_PLUGIN_PATH; unset LD_LIBRARY_PATH
          ./linuxdeployqt AppDir/usr/share/applications/anoa-browser.desktop \
            -appimage \
            -verbose=2 \
            -extra-plugins=platforminputcontexts,platformthemes

      - name: Rename AppImage
        run: |
          APPIMAGE=$(ls Anoa_Browser-*.AppImage 2>/dev/null || echo "")
          if [ -z "$APPIMAGE" ]; then
            # linuxdeployqt may produce different naming
            APPIMAGE=$(ls *.AppImage 2>/dev/null | head -1)
          fi
          mv "$APPIMAGE" anoa-browser-linux-x86_64.AppImage
          chmod +x anoa-browser-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-linux-x86_64
          path: anoa-browser-linux-x86_64.AppImage

  build-macos:
    name: macOS universal
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-macos-clang64

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt frameworks
        run: macdeployqt build/anoa-browser.app -verbose=2 -always-overwrite

      - name: Package
        run: |
          strip build/anoa-browser.app/Contents/MacOS/anoa-browser || true
          tar czf anoa-browser-macos-universal.tar.gz -C build anoa-browser.app

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-macos-universal
          path: anoa-browser-macos-universal.tar.gz

  build-windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-windows-msvc2019

      - name: Configure
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt DLLs
        run: windeployqt build\Release\anoa-browser.exe --release --no-translations --no-opengl-sw

      - name: Package
        run: 7z a anoa-browser-windows-x86_64.zip .\build\Release\*

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-windows-x86_64
          path: anoa-browser-windows-x86_64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            *.AppImage
            *.tar.gz
            *.zip
          generate_release_notes: true