name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  QT_VERSION: '6.6.0'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Qt6
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ env.QT_VERSION }}-linux-${{ matrix.arch }}

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt6
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: aqt install-qt linux desktop ${{ env.QT_VERSION }} gcc_64 -m qtwebengine

      - name: Install arm64 cross-compiler
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Create arm64 toolchain file
        if: matrix.arch == 'arm64'
        run: |
          cat > /tmp/toolchain-aarch64-linux-gnu.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Configure CMake (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=~/Qt/${{ env.QT_VERSION }}/gcc_64

      - name: Configure CMake (arm64)
        if: matrix.arch == 'arm64'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=~/Qt/${{ env.QT_VERSION }}/gcc_64 \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/toolchain-aarch64-linux-gnu.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Strip binary
        run: strip build/anoa-browser

      - name: Package
        run: tar czf anoa-browser-linux-${{ matrix.arch }}.tar.gz -C build anoa-browser

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-linux-${{ matrix.arch }}
          path: anoa-browser-linux-${{ matrix.arch }}.tar.gz

  build-macos:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Qt6
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ env.QT_VERSION }}-macos-universal

      - name: Install aqtinstall
        run: pip3 install aqtinstall

      - name: Install Qt6
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: aqt install-qt mac desktop ${{ env.QT_VERSION }} clang_64 -m qtwebengine

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=~/Qt/${{ env.QT_VERSION }}/macos \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --parallel

      - name: Strip binary
        run: strip build/anoa-browser

      - name: Package
        run: tar czf anoa-browser-macos-universal.tar.gz -C build anoa-browser

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-macos-universal
          path: anoa-browser-macos-universal.tar.gz

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Qt6
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-${{ env.QT_VERSION }}-windows-x86_64

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt6
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 -m qtwebengine --outputdir C:\Qt

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:\Qt\${{ env.QT_VERSION }}\msvc2019_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: 7z a anoa-browser-windows-x86_64.zip build\Release\anoa-browser.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-windows-x86_64
          path: anoa-browser-windows-x86_64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
