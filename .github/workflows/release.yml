name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs build and smoke-test all packages without publishing —
  # the release/tap steps only run for tag pushes. Tag pushes REQUIRE the
  # macOS signing secrets (guarded below): an unsigned release must never
  # reach GitHub Releases / the Homebrew tap.
  workflow_dispatch:

env:
  QT_VERSION: '6.7.3'

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev file patchelf

      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR \
            -DANOA_VERSION_OVERRIDE="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          cmake --build build --parallel

      - name: Package portable bundle
        run: |
          bundle=dist/anoa
          mkdir -p "$bundle"/lib "$bundle"/lib/qt6/libexec "$bundle"/resources "$bundle"/translations/qtwebengine_locales

          # Binary — one executable; terminal mode is `anoa terminal`.
          cp build/anoa "$bundle/anoa"
          chmod +x "$bundle/anoa"
          patchelf --set-rpath '$ORIGIN/lib' "$bundle/anoa"

          # Iteratively copy ALL shared lib dependencies
          # Exclude glibc/core libs that MUST come from the host system
          # Pass 1: direct deps of the binary
          ldd "$bundle/anoa" | grep "=> /" | awk '{print $3}' | sort -u | while read lib; do
            base=$(basename "$lib")
            echo "$base" | grep -qE '^libc\.so|^libm\.so|^libpthread\.so|^libdl\.so|^librt\.so|^ld-linux' && continue
            cp -vn "$lib" "$bundle/lib/" 2>/dev/null || true
          done

          # Passes 2-6: transitive deps
          for pass in 2 3 4 5 6; do
            count_before=$(ls "$bundle/lib/"*.so* 2>/dev/null | wc -l)
            for f in "$bundle"/lib/*.so*; do
              [ -L "$f" ] && continue
              [ ! -f "$f" ] && continue
              ldd "$f" 2>/dev/null | grep "=> /" | awk '{print $3}' | while read lib; do
                base=$(basename "$lib")
                echo "$base" | grep -qE '^libc\.so|^libm\.so|^libpthread\.so|^libdl\.so|^librt\.so|^ld-linux' && continue
                cp -vn "$lib" "$bundle/lib/" 2>/dev/null || true
              done
            done
            count_after=$(ls "$bundle/lib/"*.so* 2>/dev/null | wc -l)
            [ "$count_after" -eq "$count_before" ] && break
          done

          # Qt plugins
          for dir in platforminputcontexts platforms platformthemes xcbglintegrations imageformats iconengines tls; do
            [ -d "$QT_ROOT_DIR/plugins/$dir" ] && cp -r "$QT_ROOT_DIR/plugins/$dir" "$bundle/lib/"
          done

          # Qt WebEngine: libs, helper process, resources, translations
          cp "$QT_ROOT_DIR/lib/libQt6WebEngine"*so* "$bundle/lib/" 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6WebChannel"*so* "$bundle/lib/" 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6Qml"*so* "$bundle/lib/" 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6Quick"*so* "$bundle/lib/" 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6Positioning"*so* "$bundle/lib/" 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6Network"*so* "$bundle/lib/" 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6OpenGL"*so* "$bundle/lib/" 2>/dev/null || true
          # QtWebEngineProcess — in Qt6 it lives in libexec/
          if [ -f "$QT_ROOT_DIR/libexec/QtWebEngineProcess" ]; then
            cp "$QT_ROOT_DIR/libexec/QtWebEngineProcess" "$bundle/lib/qt6/libexec/"
          elif [ -f "$QT_ROOT_DIR/lib/QtWebEngineProcess" ]; then
            cp "$QT_ROOT_DIR/lib/QtWebEngineProcess" "$bundle/lib/qt6/libexec/"
          fi
          chmod +x "$bundle/lib/qt6/libexec/QtWebEngineProcess" 2>/dev/null || true
          # Resources & translations
          cp -r "$QT_ROOT_DIR/resources/"* "$bundle/resources/" 2>/dev/null || true
          cp "$QT_ROOT_DIR/translations/qtwebengine_"*.qm "$bundle/translations/" 2>/dev/null || true
          cp -r "$QT_ROOT_DIR/translations/qtwebengine_locales/"* "$bundle/translations/qtwebengine_locales/" 2>/dev/null || true

          # Fix RPATH on all bundled .so files and QtWebEngineProcess
          for so in "$bundle"/lib/*.so* "$bundle/lib/qt6/libexec/QtWebEngineProcess"; do
            [ -f "$so" ] && [ ! -L "$so" ] && patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

          # Determine absolute Qt lib path for QtWebEngineProcess RPATH
          # The process needs to find Qt libs that are one dir up from libexec/
          patchelf --set-rpath '$ORIGIN/..' "$bundle/lib/qt6/libexec/QtWebEngineProcess" 2>/dev/null || true

          # Wrapper script (primary entry point)
          cp resources/anoa.sh "$bundle/anoa.sh"
          chmod +x "$bundle/anoa.sh"

          # qt.conf: lets Qt resolve plugins/libexec/resources from the bundle
          # even without the wrapper's environment variables.
          cat > "$bundle/qt.conf" <<'QTCONF'
          [Paths]
          Prefix = .
          Plugins = lib
          LibraryExecutables = lib/qt6/libexec
          Data = .
          Translations = translations
          QTCONF

          tar czf anoa-linux-x86_64.tar.gz -C dist anoa

      - name: Smoke test the portable bundle
        run: |
          # Extract to a fresh dir and launch WITHOUT the build's Qt on the
          # library path — proves the bundle is self-contained.
          mkdir -p /tmp/bundle-test && tar xzf anoa-linux-x86_64.tar.gz -C /tmp/bundle-test
          cd /tmp/bundle-test/anoa
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --no-sandbox" \
            ./anoa.sh --headless --no-sandbox --port 9333 &
          BROWSER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9333/json/version && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9333/json/version | grep -q Browser
          curl -sf "http://127.0.0.1:9333/render/screenshot.png" -o /tmp/frame.png
          file /tmp/frame.png | grep -q "PNG image data"
          # Terminal mode is the same binary, reached through the wrapper — the
          # raw ./anoa has no LD_LIBRARY_PATH/QT_PLUGIN_PATH and must
          # never be the documented entry point. Stripping the build's Qt off
          # the environment again proves terminal mode is self-contained too.
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH \
            ./anoa.sh terminal --help > /tmp/term-help.txt
          grep -q -- '--gfx' /tmp/term-help.txt
          kill $BROWSER_PID

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-linux-x86_64
          path: anoa-linux-x86_64.tar.gz

  build-macos:
    name: macOS universal (x86_64 + arm64)
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # Fail fast on tag pushes when signing secrets are missing — otherwise
      # the release job would publish an ad-hoc (Gatekeeper-blocked) build to
      # GitHub Releases and the Homebrew tap. Manual dispatch runs are exempt:
      # they only produce throwaway artifacts.
      - name: Require signing secrets on tag pushes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for var in MACOS_CERT_P12_BASE64 APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!var:-}" ] && missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            echo "::error::Tag push requires macOS signing secrets, missing:$missing"
            echo "Refusing to publish an unsigned macOS release. Set the secrets or delete the tag."
            exit 1
          fi

      # aqt's mac desktop Qt is a universal (x86_64 + arm64) build, so a single
      # job produces one binary that runs natively on Intel and Apple Silicon.
      # qtserialport: QtWebEngineCore references QtSerialPort (Web Serial API);
      # without the module present macdeployqt aborts with "Cannot resolve
      # rpath @rpath/QtSerialPort.framework". The -v2 cache key forces a fresh
      # Qt install including the new module instead of restoring the old cache.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine qtserialport
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-macos-clang64-v2

      - name: Configure & Build (universal)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DANOA_VERSION_OVERRIDE="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          cmake --build build --parallel

      - name: Verify universal binaries
        run: |
          lipo -archs build/anoa.app/Contents/MacOS/anoa | grep -q x86_64
          lipo -archs build/anoa.app/Contents/MacOS/anoa | grep -q arm64

      - name: Strip the binary
        run: |
          # strip must precede signing — it would otherwise break the signature.
          strip -x build/anoa.app/Contents/MacOS/anoa || true

      # Import the Developer ID cert (if provided) BEFORE macdeployqt, so
      # macdeployqt can sign the bundle for notarization in one pass. macdeployqt
      # understands the Qt framework layout (QtWebEngineCore, the helper app,
      # install-name rewrites) that hand-rolled codesign loops get wrong.
      - name: Import signing certificate
        id: cert
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "identity=" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing secrets not set — building an ad-hoc bundle (Gatekeeper blocks it; the Homebrew cask strips quarantine as a fallback)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in the provided .p12"; exit 1; }
          echo "Signing as: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Deploy Qt frameworks (+ sign for notarization when signing)
        run: |
          set -euo pipefail
          APP=build/anoa.app
          IDENTITY="${{ steps.cert.outputs.identity }}"
          if [ -n "$IDENTITY" ]; then
            # macdeployqt deploys AND signs the whole bundle correctly for
            # notarization (hardened runtime + secure timestamp).
            macdeployqt "$APP" -verbose=2 -always-overwrite \
              -sign-for-notarization="$IDENTITY"
          else
            macdeployqt "$APP" -verbose=2 -always-overwrite
          fi
          PLAT="$APP/Contents/PlugIns/platforms"
          cp "$QT_ROOT_DIR/plugins/platforms/libqoffscreen.dylib" "$PLAT/" 2>/dev/null || true
          RES="$APP/Contents/Resources"
          mkdir -p "$RES/qtwebengine_locales"
          cp -r "$QT_ROOT_DIR/resources/"* "$RES/" 2>/dev/null || true
          cp -r "$QT_ROOT_DIR/translations/qtwebengine_locales/"* "$RES/qtwebengine_locales/" 2>/dev/null || true
          # Deployed Qt frameworks can carry a stray empty Versions/Resources
          # dir — an invalid framework layout. Old codesign and notarization
          # tolerate it, but Gatekeeper on current macOS rejects the whole app
          # ("embedded framework contains modified or invalid version"). Purge
          # before sealing; empty dirs are not part of the code seal.
          find "$APP/Contents/Frameworks" -type d -path '*/Versions/Resources' -empty -print -delete

      # Re-sign the leaf executables with JIT entitlements (QtWebEngine's V8
      # needs them under the hardened runtime), then reseal the enclosing
      # framework and app. Only runs on the signed path.
      - name: Apply entitlements & notarize
        if: ${{ steps.cert.outputs.identity != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP=build/anoa.app
          ENT="$GITHUB_WORKSPACE/.github/entitlements/anoa.entitlements"
          IDENTITY="${{ steps.cert.outputs.identity }}"
          sign() { codesign --force --timestamp --options runtime --sign "$IDENTITY" "$@"; }
          HELP="$APP/Contents/Frameworks/QtWebEngineCore.framework/Versions/A/Helpers/QtWebEngineProcess.app"
          [ -d "$HELP" ] && sign --entitlements "$ENT" "$HELP"
          # Plugins copied after macdeployqt's signing pass (libqoffscreen) are
          # unsigned — codesign refuses to seal the app over unsigned nested
          # code. Force-sign every plugin dylib; re-signing the rest is harmless.
          find "$APP/Contents/PlugIns" -name '*.dylib' -print0 | while IFS= read -r -d '' dylib; do
            sign "$dylib"
          done
          sign --entitlements "$ENT" "$APP/Contents/MacOS/anoa"
          # Reseal the framework that contains the re-signed helper, then the app.
          sign "$APP/Contents/Frameworks/QtWebEngineCore.framework"
          sign --entitlements "$ENT" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          # Guard: a stray empty Versions/Resources inside any framework makes
          # Gatekeeper reject the app on current macOS even though codesign and
          # notarization both pass. Fail here instead of on users' machines.
          if find "$APP/Contents/Frameworks" -type d -path '*/Versions/Resources' -empty | grep .; then
            echo "::error::Invalid framework layout: stray empty Versions/Resources dir(s) above."
            exit 1
          fi
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Ad-hoc sign (unsigned fallback only)
        if: ${{ steps.cert.outputs.identity == '' }}
        run: codesign --force --deep --sign - build/anoa.app

      - name: Smoke test the bundle
        run: |
          ./build/anoa.app/Contents/MacOS/anoa --headless --no-sandbox --port 9333 &
          BROWSER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9333/json/version && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9333/json/version | grep -q Browser
          # Terminal mode is the same signed binary — exercise the subcommand so
          # the packaged, notarized artifact is what proves it runs.
          ./build/anoa.app/Contents/MacOS/anoa terminal --help > /tmp/term-help.txt
          grep -q -- '--gfx' /tmp/term-help.txt
          kill $BROWSER_PID

      - name: Package
        run: |
          set -euo pipefail
          APP=build/anoa.app

          # Purge again, here, and verify what is about to be archived.
          #
          # The earlier purge and guard both ran and passed — the release log
          # for v0.4.1 shows `spctl --assess` answering "accepted, source=
          # Notarized Developer ID" — and the shipped tarball still contained
          # QtWebEngineCore.framework/Versions/Resources. So the stray directory
          # comes back after the guard, somewhere between it and this step, and
          # every earlier check is therefore assurance about a bundle that is no
          # longer the one being packaged.
          #
          # An empty Versions/Resources makes codesign report "embedded
          # framework contains modified or invalid version", and Gatekeeper on
          # current macOS does not merely refuse to launch it: it SIGKILLs the
          # process and deletes the app, which is why v0.4.1 vanished from
          # /Applications on first run. Removing the directory is safe after
          # stapling because it is not part of the sealed resources — with it
          # gone, `codesign --verify --deep --strict` passes on the very same
          # stapled bundle.
          find "$APP/Contents/Frameworks" -type d -path '*/Versions/Resources' -empty -print -delete

          # The check that actually matters, on the bytes that actually ship.
          # spctl alone was not enough: it passed on this release and the
          # artifact was still broken.
          codesign --verify --deep --strict --verbose=2 "$APP"

          tar czf anoa-macos-universal.tar.gz -C build anoa.app

          # And once more against the archive, because packaging is the last
          # thing that can reintroduce it.
          rm -rf "$RUNNER_TEMP/pkgcheck" && mkdir -p "$RUNNER_TEMP/pkgcheck"
          tar xzf anoa-macos-universal.tar.gz -C "$RUNNER_TEMP/pkgcheck"
          if find "$RUNNER_TEMP/pkgcheck" -type d -path '*/Versions/Resources' | grep .; then
            echo "::error::The archive contains a stray Versions/Resources — Gatekeeper will delete this app on first run."
            exit 1
          fi
          codesign --verify --deep --strict "$RUNNER_TEMP/pkgcheck/anoa.app"

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-macos-universal
          path: anoa-macos-universal.tar.gz

  build-windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-windows-msvc2019

      - name: Configure & Build
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DANOA_VERSION_OVERRIDE="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          cmake --build build --config Release

      - name: Deploy Qt DLLs & WebEngine resources
        shell: pwsh
        run: |
          windeployqt build\Release\anoa.exe --release --no-translations --no-opengl-sw
          $qtDir = $env:QT_ROOT_DIR
          New-Item -ItemType Directory -Path "build\Release\resources" -Force | Out-Null
          Copy-Item -Path "$qtDir\resources\*" -Destination "build\Release\resources\" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "build\Release\translations\qtwebengine_locales" -Force | Out-Null
          Copy-Item -Path "$qtDir\translations\qtwebengine_locales\*" -Destination "build\Release\translations\qtwebengine_locales\" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$qtDir\bin\QtWebEngineProcess.exe" -Destination "build\Release\" -Force -ErrorAction SilentlyContinue

      # Terminal mode is compiled out on Windows (see CMakeLists.txt), so the
      # subcommand must fail cleanly rather than link-fail or crash. The error
      # path in main.cpp runs before any application object exists, so this
      # needs no display — only the deployed Qt DLLs.
      - name: Verify terminal mode is refused
        shell: pwsh
        working-directory: build\Release
        run: |
          # Scratch files go to RUNNER_TEMP: build\Release is packaged wholesale
          # and must not gain stray artifacts.
          $outFile = Join-Path $env:RUNNER_TEMP 'term-out.txt'
          $errFile = Join-Path $env:RUNNER_TEMP 'term-err.txt'
          $exe = (Resolve-Path .\anoa.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList 'terminal' `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $text = (Get-Content $errFile -Raw)
          Write-Host "exit=$($p.ExitCode) stderr=$text"
          if ($p.ExitCode -eq 0) {
            throw "anoa terminal must exit non-zero on Windows, got 0"
          }
          if ($text -notmatch 'not supported on Windows') {
            throw "anoa terminal did not print the unsupported-platform error"
          }

      - name: Package
        run: 7z a anoa-windows-x86_64.zip .\build\Release\*

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-windows-x86_64
          path: anoa-windows-x86_64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true

      # Skips (does not fail the release) when HOMEBREW_TAP_TOKEN is not set —
      # the GitHub Release above has already published the artifacts. Update
      # the tap manually or re-run with the secret configured. The token is
      # checked inside the script because the `secrets` context is not reliably
      # available in a step-level `if:`.
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap update. Release artifacts are published; update the tap manually or re-run after setting the secret."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          MACOS_SHA256=$(sha256sum anoa-macos-universal.tar.gz | awk '{print $1}')
          LINUX_SHA256=$(sha256sum anoa-linux-x86_64.tar.gz | awk '{print $1}')
          git clone --depth=1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/porcupine-md/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p Casks Formula

          # macOS Cask
          sed -e "s/{{VERSION}}/${VERSION}/" \
              -e "s/{{MACOS_SHA256}}/${MACOS_SHA256}/" \
              "${GITHUB_WORKSPACE}/.github/homebrew/anoa.rb.tpl" > Casks/anoa.rb

          # Linux Formula
          sed -e "s/{{VERSION}}/${VERSION}/" \
              -e "s/{{LINUX_SHA256}}/${LINUX_SHA256}/" \
              "${GITHUB_WORKSPACE}/.github/homebrew/anoa-linux.rb.tpl" > Formula/anoa-linux.rb

          # Retire the old names properly rather than leaving two of everything.
          #
          # Homebrew reads these maps from a tap root and follows them on
          # upgrade, so someone who installed `anoa-browser` is carried to
          # `anoa` instead of being told the cask no longer exists. Deleting the
          # old files without the maps would strand them: `brew upgrade` reports
          # "No available formula or cask" and their install just stops getting
          # updates, silently.
          printf '{\n  "anoa-browser": "anoa"\n}\n' > cask_renames.json
          printf '{\n  "anoa-browser-linux": "anoa-linux"\n}\n' > formula_renames.json
          rm -f Casks/anoa-browser.rb Formula/anoa-browser-linux.rb

          git add -A
          git commit -m "anoa v${VERSION}"
          git push