name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  QT_VERSION: '6.7.3'

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev file desktop-file-utils libfuse2 fuse

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Build AppImage
        run: |
          # Install into AppDir
          DESTDIR=AppDir cmake --install build

          # Bundle Qt shared libraries
          mkdir -p AppDir/usr/lib
          ldd AppDir/usr/bin/anoa-browser | grep "=> /" | awk '{print $3}' | sort -u | while read lib; do
            cp -vn "$lib" AppDir/usr/lib/
          done

          # Copy Qt plugins
          mkdir -p AppDir/usr/plugins
          for dir in platforminputcontexts platforms platformthemes xcbglintegrations imageformats iconengines tls; do
            if [ -d "$QT_ROOT_DIR/plugins/$dir" ]; then
              cp -r "$QT_ROOT_DIR/plugins/$dir" AppDir/usr/plugins/
            fi
          done

          # Copy Qt WebEngine resources
          mkdir -p AppDir/usr/resources
          cp -r "$QT_ROOT_DIR/resources/"* AppDir/usr/resources/ 2>/dev/null || true
          cp -r "$QT_ROOT_DIR/translations/" AppDir/usr/translations 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6WebEngineCore.so"* AppDir/usr/lib/ 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6WebEngineWidgets.so"* AppDir/usr/lib/ 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6WebEngineProcess"* AppDir/usr/lib/ 2>/dev/null || true
          ls "$QT_ROOT_DIR/lib/" | grep -i webengine | while read f; do
            cp -vn "$QT_ROOT_DIR/lib/$f" AppDir/usr/lib/
          done

          # Fix RPATH in all bundled libs
          for so in AppDir/usr/lib/*.so*; do
            if [ -f "$so" ] && [ ! -L "$so" ]; then
              patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
            fi
          done

          # Set binary RPATH
          patchelf --set-rpath '$ORIGIN/../lib' AppDir/usr/bin/anoa-browser

          # Create AppRun
          cat > AppDir/AppRun << 'APPSCRIPT'
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=$(dirname "$SELF")
          export QT_PLUGIN_PATH="${HERE}/usr/plugins:${QT_PLUGIN_PATH}"
          export QTWEBENGINEPROCESS_PATH="${HERE}/usr/lib/QtWebEngineProcess"
          export QTWEBENGINERESOURCEPATH="${HERE}/usr/resources"
          export QTWEBENGINE_LOCALE="${HERE}/usr/translations/qtwebengine_locales"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/anoa-browser" "$@"
          APPSCRIPT
          chmod +x AppDir/AppRun

          # Create AppImage using mksquashfs
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir anoa-browser-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-linux-x86_64
          path: anoa-browser-linux-x86_64.AppImage

  build-macos:
    name: macOS universal
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-macos-clang64

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt frameworks
        run: macdeployqt build/anoa-browser.app -verbose=2 -always-overwrite

      - name: Package
        run: |
          strip build/anoa-browser.app/Contents/MacOS/anoa-browser || true
          tar czf anoa-browser-macos-universal.tar.gz -C build anoa-browser.app

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-macos-universal
          path: anoa-browser-macos-universal.tar.gz

  build-windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-windows-msvc2019

      - name: Configure
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt DLLs
        run: windeployqt build\Release\anoa-browser.exe --release --no-translations --no-opengl-sw

      - name: Package
        run: 7z a anoa-browser-windows-x86_64.zip .\build\Release\*

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-windows-x86_64
          path: anoa-browser-windows-x86_64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            *.AppImage
            *.tar.gz
            *.zip
          generate_release_notes: true