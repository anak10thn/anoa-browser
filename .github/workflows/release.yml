name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  QT_VERSION: '6.7.3'

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev file

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Package portable bundle
        run: |
          mkdir -p dist/anoa-browser/lib dist/anoa-browser/resources dist/anoa-browser/translations

          # Binary — do NOT strip (removes symbol table needed by QtWebEngine)
          cp build/anoa-browser dist/anoa-browser/anoa-browser
          chmod +x dist/anoa-browser/anoa-browser

          # Set RPATH so binary finds libs in ./lib
          patchelf --set-rpath '$ORIGIN/lib' dist/anoa-browser/anoa-browser

          # Copy direct + transitive shared library dependencies (iterative)
          # ldd only shows direct deps — we repeat until no new libs are found
          prev_count=0
          cur_count=$(ls dist/anoa-browser/lib/*.so* 2>/dev/null | wc -l || echo 0)
          ldd dist/anoa-browser/anoa-browser | grep "=> /" | awk '{print $3}' | sort -u | while read lib; do
            cp -vn "$lib" dist/anoa-browser/lib/ 2>/dev/null || true
          done
          while true; do
            prev_count=$cur_count
            for f in dist/anoa-browser/lib/*.so*; do
              [ -L "$f" ] && continue
              [ ! -f "$f" ] && continue
              ldd "$f" 2>/dev/null | grep "=> /" | awk '{print $3}' | sort -u | while read lib; do
                cp -vn "$lib" dist/anoa-browser/lib/ 2>/dev/null || true
              done
            done
            cur_count=$(ls dist/anoa-browser/lib/*.so* 2>/dev/null | wc -l)
            [ "$cur_count" -eq "$prev_count" ] && break
          done

          # Qt plugins
          for dir in platforminputcontexts platforms platformthemes xcbglintegrations imageformats iconengines tls; do
            if [ -d "$QT_ROOT_DIR/plugins/$dir" ]; then
              cp -r "$QT_ROOT_DIR/plugins/$dir" dist/anoa-browser/lib/
            fi
          done

          # Qt WebEngine resources & helper process
          cp "$QT_ROOT_DIR/lib/libQt6WebEngineCore.so"* dist/anoa-browser/lib/ 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6WebEngineWidgets.so"* dist/anoa-browser/lib/ 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6WebEngineQuick.so"* dist/anoa-browser/lib/ 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/libQt6WebEngineQuickDelegatesQml.so"* dist/anoa-browser/lib/ 2>/dev/null || true
          cp "$QT_ROOT_DIR/lib/QtWebEngineProcess" dist/anoa-browser/lib/ 2>/dev/null || true
          cp -r "$QT_ROOT_DIR/resources/"* dist/anoa-browser/resources/ 2>/dev/null || true
          mkdir -p dist/anoa-browser/translations/qtwebengine_locales
          cp "$QT_ROOT_DIR/translations/qtwebengine_"*.qm dist/anoa-browser/translations/ 2>/dev/null || true
          cp -r "$QT_ROOT_DIR/translations/qtwebengine_locales/"* dist/anoa-browser/translations/qtwebengine_locales/ 2>/dev/null || true

          # Fix RPATH on all bundled libs
          for so in dist/anoa-browser/lib/*.so*; do
            if [ -f "$so" ] && [ ! -L "$so" ]; then
              patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
            fi
          done

          # Wrapper script
          cat > dist/anoa-browser/anoa-browser.sh << 'EOF'
          #!/bin/sh
          SCRIPT="$(readlink -f "$0")"
          DIR="$(dirname "$SCRIPT")"
          export QT_PLUGIN_PATH="${DIR}/lib:${QT_PLUGIN_PATH}"
          export QTWEBENGINEPROCESS_PATH="${DIR}/lib/QtWebEngineProcess"
          export QTWEBENGINERESOURCEPATH="${DIR}/resources"
          export QTWEBENGINE_LOCALE="${DIR}/translations/qtwebengine_locales"
          export LD_LIBRARY_PATH="${DIR}/lib:${LD_LIBRARY_PATH}"
          exec "${DIR}/anoa-browser" "$@"
          EOF
          chmod +x dist/anoa-browser/anoa-browser.sh

          tar czf anoa-browser-linux-x86_64.tar.gz -C dist anoa-browser

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-linux-x86_64
          path: anoa-browser-linux-x86_64.tar.gz

  build-macos:
    name: macOS universal
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-macos-clang64

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt frameworks
        run: macdeployqt build/anoa-browser.app -verbose=2 -always-overwrite

      - name: Package
        run: |
          strip build/anoa-browser.app/Contents/MacOS/anoa-browser || true
          tar czf anoa-browser-macos-universal.tar.gz -C build anoa-browser.app

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-macos-universal
          path: anoa-browser-macos-universal.tar.gz

  build-windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-windows-msvc2019

      - name: Configure
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt DLLs
        run: windeployqt build\Release\anoa-browser.exe --release --no-translations --no-opengl-sw

      - name: Package
        run: 7z a anoa-browser-windows-x86_64.zip .\build\Release\*

      - uses: actions/upload-artifact@v4
        with:
          name: anoa-browser-windows-x86_64
          path: anoa-browser-windows-x86_64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true